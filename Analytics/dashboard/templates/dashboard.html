{% extends "layouts/base.html" %}
{% load static %}
{% load custom_tags %}

{% block content %}

<div class="container-fluid mt-4">
  <div class="row">
    <!-- Left Column: Graph and Controls -->
    <div class="col-md-9">
      <h2 class="mb-3">🧠 Temporal Louvain Network Tool</h2>

      <div class="row mb-3">
        <div class="col-md-4">
          <label for="metricSelect">Metric:</label>
          <select id="metricSelect" class="form-select">
            <option value="pagerank">Pagerank</option>
            <option value="degree">Degree</option>
            <option value="betweenness">Betweenness</option>
          </select>
        </div>
        <div class="col-md-4">
          <label for="thresholdSlider">Threshold:</label>
          <input type="range" id="thresholdSlider" class="form-range" min="0" max="1" step="0.01" value="0.05">
          <span id="thresholdValue">0.05</span>
        </div>
        <div class="col-md-4">
          <label for="quarterSelect">Quarter:</label>
          <select id="quarterSelect" class="form-select">
            <option value="2024Q1" {% if selected_quarter == "2024Q1" %}selected{% endif %}>2024Q1</option>
            <option value="2024Q2" {% if selected_quarter == "2024Q2" %}selected{% endif %}>2024Q2</option>
            <option value="2024Q3" {% if selected_quarter == "2024Q3" %}selected{% endif %}>2024Q3</option>
            <option value="2024Q4" {% if selected_quarter == "2024Q4" %}selected{% endif %}>2024Q4</option>
          </select>
        </div>
      </div>

      <div id="networkGraph" style="height: 700px;"></div>
    </div>

    <!-- Right Column: Static Community Legend -->
    <!-- Right Column: Dynamic Legend -->
  <div class="col-md-3">
    <div style="position: sticky; top: 80px;">
      <h6 class="mb-3">🗌️ Κοινότητες (Δυναμικός Οδηγός)</h6>
      <ul id="dynamicLegend" class="list-unstyled"></ul>
    </div>
  </div>

  </div>
</div>

<script>
  const NETWORK_DATA = {{ network_data|safe }};

  document.getElementById("quarterSelect").addEventListener("change", function () {
    const selectedQuarter = this.value;
    const metric = document.getElementById("metricSelect").value;
    const threshold = document.getElementById("thresholdSlider").value;
    const newUrl = `?quarter=${selectedQuarter}&metric=${metric}&threshold=${threshold}`;
    window.location.href = newUrl;
  });
</script>

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<script src="{% static 'assets/network.js' %}"></script>

{% endblock content %}
